# Add these two location blocks to the existing HTTPS server for your domain.
# Keep them more specific than `location /` so the rest of the site is unchanged.
#
# Node must be started with the same prefix, listening only on loopback:
#   BASE_PATH=/trashbox/game/sniper HOST=127.0.0.1 PORT=8080 pnpm start
#
# proxy_pass has no trailing URI on purpose: the full `/trashbox/game/sniper/...`
# path is forwarded to Node, which also serves that prefix.

location = /trashbox/game/sniper {
    return 301 /trashbox/game/sniper/;
}

location /trashbox/game/sniper/ws {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

location /trashbox/game/sniper/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# 在现有主域名 HTTPS server 中合并这些 location；替换仓库绝对路径。
# 需要 Nginx http_auth_request_module。先 nginx -t，再 reload。
# 保留现有证书、/Journal/、/ll/、上传文件映射和带签名的 webhook location。
# 不要给整个 server 设置 auth_request，否则上述独立服务也会被拦截。
# /api/v1/ 的最终权限校验由 FastAPI 完成，兼容小程序的有效 Bearer JWT。
# 主域名建议统一为 trashbox.tech；Radar 子域名配置见 nginx-radar-redirect.conf。

location = /_trashbox_auth_check {
    internal;
    proxy_pass http://127.0.0.1:2026/api/v1/auth/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Original-URI $request_uri;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
}

# 仅页面门禁使用此跳转。API、资源与 WebSocket 保持 401。
location @trashbox_login {
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    return 302 /login?return_to=$request_uri;
}

location = /robots.txt {
    default_type text/plain;
    add_header Cache-Control "no-cache" always;
    return 200 "User-agent: *\nDisallow: /\nAllow: /Journal/\nAllow: /ll/\nAllow: /the-ninth-art-game-cloud/\n";
}

location = /login {
    root /ABSOLUTE/PATH/TO/TrashBox/.serve-public;
    try_files /auth/index.html =404;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
location = /login/ { return 302 /login$is_args$args; }

location = /account {
    auth_request /_trashbox_auth_check;
    error_page 401 = @trashbox_login;
    root /ABSOLUTE/PATH/TO/TrashBox/.serve-public;
    try_files /auth/index.html =404;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
location = /account/ { return 302 /account$is_args$args; }

# 登录页面所需的资源公开。其他 /auth/ 地址不提供产品页面。
location ^~ /auth/auth-static/ {
    root /ABSOLUTE/PATH/TO/TrashBox/.serve-public;
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
location /auth/ { return 404; }

# 统一认证的发起、回调、二维码轮询必须可在登录前到达。
# 账户、绑定、注销和其他私有操作仍由各 FastAPI 路由检查会话与 CSRF。
location ^~ /api/v1/auth/callback/ {
    access_log off;
    proxy_pass http://127.0.0.1:2026;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
location ^~ /api/v1/ {
    proxy_pass http://127.0.0.1:2026;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}

location = /radar { return 301 /radar/$is_args$args; }

location ^~ /radar/assets/ {
    auth_request /_trashbox_auth_check;
    root /ABSOLUTE/PATH/TO/TrashBox/.serve-public;
    try_files $uri =404;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
location /radar/ {
    auth_request /_trashbox_auth_check;
    error_page 401 = @trashbox_login;
    root /ABSOLUTE/PATH/TO/TrashBox/.serve-public;
    try_files $uri $uri/ /radar/index.html;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}

location = /game/sniper { return 301 /game/sniper/$is_args$args; }
location = /game/sniper/ws {
    auth_request /_trashbox_auth_check;
    proxy_pass http://127.0.0.1:8003;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
location ^~ /game/sniper/assets/ {
    auth_request /_trashbox_auth_check;
    proxy_pass http://127.0.0.1:8003;
    proxy_set_header Host $host;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
location /game/sniper/ {
    auth_request /_trashbox_auth_check;
    error_page 401 = @trashbox_login;
    proxy_pass http://127.0.0.1:8003;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}

# Music 的页面、API、资源与 Socket.IO 都放在 /Music/ 下。
# 去掉公共前缀后转发；Flask 通过 X-Script-Name 生成带 /Music 的链接。
location = /Music { return 301 /Music/$is_args$args; }
location ^~ /Music/api/ {
    auth_request /_trashbox_auth_check;
    proxy_pass http://127.0.0.1:8004/api/;
    proxy_set_header X-Script-Name /Music;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
location ^~ /Music/socket.io/ {
    auth_request /_trashbox_auth_check;
    proxy_pass http://127.0.0.1:8004/socket.io/;
    proxy_set_header X-Script-Name /Music;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
location ^~ /Music/static/ {
    auth_request /_trashbox_auth_check;
    proxy_pass http://127.0.0.1:8004/static/;
    proxy_set_header X-Script-Name /Music;
    proxy_set_header Host $host;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
location /Music/ {
    auth_request /_trashbox_auth_check;
    error_page 401 = @trashbox_login;
    proxy_pass http://127.0.0.1:8004/;
    proxy_set_header X-Script-Name /Music;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}

location ^~ /site-static/ {
    auth_request /_trashbox_auth_check;
    root /ABSOLUTE/PATH/TO/TrashBox/.serve-public;
    try_files $uri =404;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
location / {
    auth_request /_trashbox_auth_check;
    error_page 401 = @trashbox_login;
    root /ABSOLUTE/PATH/TO/TrashBox/.serve-public;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}

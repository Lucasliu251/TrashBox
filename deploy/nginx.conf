# 将这些规则放进现有域名的 HTTPS `server { ... }` 中。
# 首次使用前，把 /ABSOLUTE/PATH/TO/TrashBox 替换为服务器上的仓库绝对路径。
#
# 生产结构：
#   /                → Nginx 直接读取 .serve-public/
#   /radar/          → Nginx 直接读取 .serve-public/radar/
#   /game/sniper/    → 127.0.0.1:8003（Node + sirv）
#   /game/sniper/ws  → 127.0.0.1:8003（WebSocket）

location = /radar {
    return 301 /radar/;
}

# 兼容后端当前 WEB_ORIGIN=https://trashbox.tech 的 Steam 回调地址。
# 登录码仍由 /radar/ 页面消费，保留原查询参数。
location = /auth/callback {
    return 302 /radar/auth/callback$is_args$args;
}

# Vite 带内容哈希的资源可以长期缓存；新构建会生成新文件名。
location ^~ /radar/assets/ {
    root /ABSOLUTE/PATH/TO/TrashBox/.serve-public;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# Radar SPA：真实文件优先，其他页面路由回退到 index.html。
location /radar/ {
    root /ABSOLUTE/PATH/TO/TrashBox/.serve-public;
    try_files $uri $uri/ /radar/index.html;
    add_header Cache-Control "no-cache" always;
}

location = /game/sniper {
    return 301 /game/sniper/;
}

location /game/sniper/ws {
    proxy_pass http://127.0.0.1:8003;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

location /game/sniper/ {
    proxy_pass http://127.0.0.1:8003;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# 主站放在最后；更长的 /radar/、/game/sniper/ 和现有 /api/ 规则会优先匹配。
location / {
    root /ABSOLUTE/PATH/TO/TrashBox/.serve-public;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
}

# Fixed public Blizzard origin only. Never forward browser identity headers.
resolver 127.0.0.53 valid=300s ipv6=off;
resolver_timeout 2s;
set $trashbox_ow_origin https://webapi.blizzard.cn;
limit_req zone=trashbox_ow_global burst=12 nodelay;
limit_req_status 429;
proxy_http_version 1.1;
proxy_pass_request_headers off;
proxy_pass_request_body off;
proxy_set_header Host webapi.blizzard.cn;
proxy_set_header Accept application/json;
proxy_set_header User-Agent TrashBox-OW-Public/1.0;
proxy_set_header Connection "";
proxy_set_header Content-Length "";
proxy_set_header Origin "";
proxy_set_header Referer "";
proxy_set_header Authorization "";
proxy_set_header Cookie "";
proxy_ssl_server_name on;
proxy_ssl_name webapi.blizzard.cn;
proxy_ssl_protocols TLSv1.2 TLSv1.3;
proxy_ssl_verify on;
proxy_ssl_verify_depth 3;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_connect_timeout 3s;
proxy_send_timeout 6s;
proxy_read_timeout 6s;
proxy_next_upstream off;
proxy_cache off;
proxy_hide_header Set-Cookie;
proxy_hide_header Cache-Control;
proxy_hide_header Expires;
add_header Cache-Control "no-store" always;
add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

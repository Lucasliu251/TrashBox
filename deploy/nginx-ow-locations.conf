# Include only inside the existing trashbox.tech HTTPS server.
# Keep its existing login policy for the page and private APIs.
location = /ow-live/index {
    if ($request_method != GET) { return 405; }
    if ($args != "") { return 400; }
    include /etc/nginx/snippets/trashbox-ow-proxy.conf;
    proxy_pass $trashbox_ow_origin/ow-armory-server/index;
}
location = /ow-live/hero_leaderboard {
    if ($request_method != GET) { return 405; }
    if ($args !~ "^game_mode=jingji&season=[1-9][0-9]{0,5}&mmr=-127$") { return 400; }
    include /etc/nginx/snippets/trashbox-ow-proxy.conf;
    proxy_pass $trashbox_ow_origin/ow-armory-server/hero_leaderboard?$args;
}
location = /ow-live { return 404; }
location ^~ /ow-live/ { return 404; }

# These JSON files contain public hero aggregates/assets only. The adapter uses
# credentials:omit, so they remain readable independently of the main page gate.
location ^~ /ow-data/ {
    root /ABSOLUTE/PATH/TO/TrashBox/.serve-public;
    try_files $uri =404;
    autoindex off;
    limit_except GET { deny all; }
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}

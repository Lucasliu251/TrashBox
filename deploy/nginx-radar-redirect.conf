# 放入已有 radar.trashbox.tech 的 HTTP 与 HTTPS server 块。
# 保留各 server 的 listen、server_name 与证书；把 trashbox.tech 改为实际主域名。
# 旧子域名上的 cookie 不做共享或账户合并；登录统一在主域名完成。
location = /radar { return 308 https://trashbox.tech/radar/$is_args$args; }
location /radar/ { return 308 https://trashbox.tech$request_uri; }
location / { return 308 https://trashbox.tech/radar$request_uri; }

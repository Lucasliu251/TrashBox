<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrashBox 创作者中心 | Community Edition</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background-color: #f8fafc;
        }
        /* 自定义编辑器样式，使其更像文档 */
        .ql-toolbar {
            border: none !important;
            border-bottom: 1px solid #e2e8f0 !important;
            padding: 12px 16px !important;
            border-radius: 12px 12px 0 0;
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .ql-container {
            border: none !important;
            border-radius: 0 0 12px 12px;
            background: #fff;
            font-size: 16px;
            min-height: 500px; /* 编辑区域高度 */
        }
        .ql-editor {
            padding: 30px 40px;
            line-height: 1.8;
            color: #334155;
        }
        .ql-editor h1 { font-size: 2em; font-weight: 700; margin-bottom: 0.5em; margin-top: 1em; }
        .ql-editor h2 { font-size: 1.5em; font-weight: 600; border-left: 4px solid #6366f1; padding-left: 12px; margin-top: 1.5em; margin-bottom: 0.5em; background: #f1f5f9; padding-top:4px; padding-bottom:4px; }
        .ql-editor blockquote {
            border-left: 4px solid #818cf8;
            background-color: #f5f3ff;
            padding: 10px 16px;
            color: #4f46e5;
            font-style: italic;
        }
        .ql-editor img {
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin: 10px 0;
            max-width: 100%;
        }
        /* 选中状态 */
        .input-focus-ring:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            border-color: #6366f1;
        }
    </style>
</head>
<body class="text-slate-800 pb-20">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-6 h-16 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold text-lg">T</div>
                <span class="font-bold text-xl tracking-tight text-slate-800">TrashBox <span class="text-indigo-600 font-normal text-sm ml-1">Creator</span></span>
            </div>
            <div class="flex items-center space-x-4">
                <div class="flex items-center bg-slate-100 rounded-full px-4 py-1.5 border border-slate-200">
                    <span class="text-xs font-semibold text-slate-500 mr-2 uppercase tracking-wider">Identity</span>
                    <input type="text" id="user-uuid" placeholder="粘贴你的 UUID / OpenID" class="bg-transparent border-none text-sm w-48 focus:outline-none text-slate-700 font-mono">
                </div>
                <button onclick="submitPost()" class="bg-slate-900 hover:bg-slate-800 text-white px-6 py-2 rounded-full font-medium transition-all shadow-lg hover:shadow-xl flex items-center">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    发布文章
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto mt-10 px-6">
        
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                <div class="md:col-span-3">
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">文章标题</label>
                    <input type="text" id="post-title" class="w-full text-2xl font-bold border-b-2 border-slate-100 py-2 input-focus-ring rounded-t-md transition-colors placeholder-slate-300" placeholder="请输入震撼的标题...">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">选择版块</label>
                    <div class="relative">
                        <select id="post-tag" class="w-full appearance-none bg-slate-50 border border-slate-200 text-slate-700 py-3 px-4 pr-8 rounded-xl font-medium focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                            <option value="赛事">🏆 赛事战报</option>
                            <option value="更新">🔄 更新日志</option>
                            <option value="讨论">💬 深度讨论</option>
                            <option value="吐槽">💣 每日吐槽</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-500">
                            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="relative bg-white rounded-2xl shadow-sm border border-slate-200">
            <div class="absolute right-4 top-4 z-20 flex space-x-2">
                <button onclick="loadTemplate()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-600 text-xs px-3 py-1.5 rounded-lg font-medium transition-colors border border-indigo-200 flex items-center">
                    <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                    加载“年度战报”模板
                </button>
                <button onclick="clearEditor()" class="bg-slate-50 hover:bg-red-50 text-slate-500 hover:text-red-500 text-xs px-3 py-1.5 rounded-lg font-medium transition-colors border border-slate-200">
                    清空
                </button>
            </div>

            <div id="editor"></div>
        </div>

        <div class="text-center mt-8 text-slate-400 text-sm">
            <p>发布的内容将直接同步至 TrashBox 小程序数据库</p>
        </div>

    </main>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script>
        // ================= 配置区 =================
        const API_BASE = "https://trashbox.tech"; // 你的后端地址
        const UPLOAD_URL = `${API_BASE}/api/v1/posts/upload`;
        const POST_URL = `${API_BASE}/api/v1/posts`;

        // ================= 初始化编辑器 =================
        // 定义工具栏选项，不仅仅是加粗
        const toolbarOptions = [
            [{ 'header': [1, 2, 3, false] }], // 标题 H1, H2, H3
            ['bold', 'italic', 'underline', 'strike'], // 加粗、斜体、下划线、删除线
            [{ 'color': [] }, { 'background': [] }], // 字体颜色、背景色 (高亮)
            [{ 'list': 'ordered'}, { 'list': 'bullet' }], // 列表
            ['blockquote', 'code-block'], // 引用、代码块
            [{ 'align': [] }], // 对齐
            ['link', 'image'] // 链接、图片
        ];

        var quill = new Quill('#editor', {
            theme: 'snow',
            placeholder: '在此处挥洒你的才华...',
            modules: {
                toolbar: {
                    container: toolbarOptions,
                    handlers: {
                        // 劫持图片上传按钮，走我们自定义的上传逻辑
                        'image': imageHandler
                    }
                }
            }
        });

        // ================= 核心功能：图片上传 =================
        function imageHandler() {
            const input = document.createElement('input');
            input.setAttribute('type', 'file');
            input.setAttribute('accept', 'image/*');
            input.click();

            input.onchange = async () => {
                const file = input.files[0];
                if (!file) return;

                // 显示上传中状态
                const range = quill.getSelection();
                const loadingText = " [图片上传中...] ";
                quill.insertText(range.index, loadingText, { 'color': '#999', 'italic': true });

                const formData = new FormData();
                formData.append('file', file);

                try {
                    const response = await fetch(UPLOAD_URL, {
                        method: 'POST',
                        body: formData
                    });
                    const result = await response.json();

                    // 删除“上传中”提示
                    quill.deleteText(range.index, loadingText.length);

                    if (result.code === 200) {
                        // 插入图片到编辑器
                        quill.insertEmbed(range.index, 'image', result.url);
                        // 光标移到图片后面
                        quill.setSelection(range.index + 1);
                    } else {
                        alert('上传失败: ' + result.message);
                    }
                } catch (error) {
                    console.error(error);
                    quill.deleteText(range.index, loadingText.length);
                    alert('上传出错，请检查网络或后端 CORS 配置');
                }
            };
        }

        // ================= 核心功能：提交文章 =================
        async function submitPost() {
            const uuid = document.getElementById('user-uuid').value.trim();
            const title = document.getElementById('post-title').value.trim();
            const tag = document.getElementById('post-tag').value;
            const content = quill.root.innerHTML; // 获取 HTML

            // 简单校验
            if (!uuid) return alert('请填写 UUID / OpenID 才能发布');
            if (!title) return alert('标题不能为空');
            // 去除空白标签后的长度校验
            if (quill.getText().trim().length < 5) return alert('多写点内容吧，太短了');

            const payload = {
                openid: uuid,
                title: title,
                content: content,
                tag: tag
            };

            const submitBtn = document.querySelector('button[onclick="submitPost()"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '发布中...';
            submitBtn.disabled = true;

            try {
                const response = await fetch(POST_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const res = await response.json();

                if (res.code === 200) {
                    alert('🎉 发布成功！已同步至小程序');
                    // 可选：清空表单
                    // clearEditor();
                    // document.getElementById('post-title').value = '';
                } else {
                    alert('发布失败: ' + (res.message || res.detail));
                }
            } catch (error) {
                console.error(error);
                alert('网络请求错误，请检查后端服务');
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        }

        // ================= 辅助功能 =================
        function clearEditor() {
            if(confirm('确定要清空编辑器内容吗？')) {
                quill.setText('');
            }
        }

        // 年度模板 - 包含你要求的冷知识、排版
        function loadTemplate() {
            const template = `
                <p><strong>By TrashBox.tech (Community Edition)</strong></p>
                <p><br></p>
                <h2>🌍 毁灭世界的数据</h2>
                <p><strong>全队总伤害值： <span style="color: rgb(230, 0, 0);">55,532,005</span></strong></p>
                <blockquote>
                冷知识： 如果每一滴血代表1毫升水，这5500万的伤害量足以填满大约 <strong>22个奥运会标准游泳池</strong>。这一年，大家为了赢下比赛，真是把鼠标左键都按冒烟了。
                </blockquote>
                <p><br></p>
                <p><strong>全队总击杀数： <span style="color: rgb(230, 0, 0);">388,981</span></strong></p>
                <blockquote>
                冷知识： 这意味着在2025年，平均每天有超过 <strong>1,065 个虚拟生命</strong>在服务器中倒下。如果把这些击杀连起来，足以填满好几个大型足球场的观众席。
                </blockquote>
                <p><br></p>
                <h2>☠️ 惨烈的战场</h2>
                <p><strong>全队总死亡数： 361,662</strong></p>
                <p>或者是我们的餐具大师（死亡数第一）其实还少算了几次？</p>
                <p><br></p>
                <h2>🏆 荣耀时刻</h2>
                <p><strong>全服总MVP数： <span style="color: rgb(255, 153, 0);">45,862</span></strong></p>
                <blockquote>
                冷知识： 每一个MVP背后都是一次令人激动的胜利音乐。这4万多次的MVP时刻，记录了无数次拆包、连杀和极限残局。
                </blockquote>
                <p><br></p>
                <h2>📊 年度之最</h2>
                <p><strong>🔪 最强“人头收割机”：</strong> <strong>深藏Blue</strong> (38,279 击杀)</p>
                <p class="ql-indent-1">他一个人就贡献了全服近 10% 的击杀量。</p>
                <p><br></p>
                <p><strong>🎯 最惨“移动靶”：</strong> <strong>餐具大师</strong> (29,424 死亡)</p>
                <p class="ql-indent-1">全服每死亡 12 次，就有一次是餐具大师倒在地上。</p>
                <p><br></p>
                <p><strong>🔥 最痛“输出机器”：</strong> <strong>Lucas</strong> (5,478,336 伤害)</p>
                <p class="ql-indent-1">如果你觉得痛，那多半是他打的。</p>
                <p><br></p>
                <h2>🏆 特别奖项</h2>
                <p><strong>🍖 “人体描边/刮痧大师”奖</strong></p>
                <p>获奖者： <strong>彦祖没有我潇</strong></p>
                <p class="ql-indent-1">平均每击杀一名敌人需要造成 173.5 点伤害。</p>
                <p><br></p>
                <p><strong>👑 “性价比之王”奖</strong></p>
                <p>获奖者： <strong>法兰西多士</strong></p>
                <p class="ql-indent-1">MVP率高达 28.9%（每3-4个击杀就能换来一个MVP）。</p>
                <p><br></p>
                <p><strong>💀 “地狱专列常客”奖</strong></p>
                <p>获奖者： <strong>我没文化</strong></p>
                <p class="ql-indent-1">日均死亡 120 次，总死亡 41,357 次。</p>
                <p><br></p>
                <p><strong>🗓️ “住在网吧”奖（全勤奖）</strong></p>
                <p>获奖者： <strong>我没文化</strong> (344天)</p>
            `;
            
            // 插入模板到编辑器开头
            quill.clipboard.dangerouslyPasteHTML(0, template);
        }
    </script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrashBox</title>
    <style>
      :root { color-scheme: dark; --gold: #dca04a; --line: #2d3233; --muted: #81898a; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font-family: Inter, "PingFang SC", sans-serif; color: #eeeae2;
        background: radial-gradient(circle at 75% -10%, rgba(220,160,74,.12), transparent 30%), #101314;
      }
      main { width: min(720px, calc(100% - 48px)); }
      .kicker { color: var(--gold); font-size: 11px; font-weight: 700; letter-spacing: .22em; }
      h1 { margin: 18px 0 10px; font-size: clamp(42px, 8vw, 72px); letter-spacing: -.04em; text-transform: uppercase; }
      h1 em { color: var(--gold); font-style: italic; }
      p { color: var(--muted); line-height: 1.7; }
      nav { display: grid; gap: 12px; margin-top: 36px; }
      a {
        display: flex; justify-content: space-between; align-items: center;
        padding: 18px 20px; color: inherit; text-decoration: none;
        border: 1px solid var(--line); background: #1b1f20;
      }
      a strong { font-size: 18px; }
      a small { color: var(--muted); }
      a:hover { border-color: var(--gold); }
    </style>
  </head>
  <body>
    <main>
      <div class="kicker">TRASHBOX</div>
      <h1>一条域名。<em>三条路径。</em></h1>
      <p>经 Nginx 反代后：主站在 <code>/</code>，Radar 在 <code>/radar/</code>，Sniper 在 <code>/game/sniper/</code>。</p>
      <nav>
        <a href="/radar/"><strong>Radar</strong><small>/radar/</small></a>
        <a href="/game/sniper/"><strong>Sniper</strong><small>/game/sniper/</small></a>
      </nav>
    </main>
  </body>
</html>
